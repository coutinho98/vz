services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vz
      POSTGRES_PASSWORD: vz
      POSTGRES_DB: vz
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vz -d vz']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--notify-keyspace-events', 'Ex']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://vz:vz@db:5432/vz?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      PORT: 3000
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && node dist/src/main.js"

  web:
    build:
      context: ./frontend
      args:
        # em producao o front nao usa proxy: aponta direto para a api
        VITE_API_URL: http://localhost:3000/api
    ports:
      - '5173:5173'
    depends_on:
      - api

volumes:
  pgdata:
